name: Publish PostgreSQL Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_part:
        description: "Version part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: publish-postgres
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Migrate legacy postgres tags
        run: |
          legacy_tag="$(git tag -l 'postgres-v*' --sort=-version:refname | head -n 1)"
          if [ -z "$legacy_tag" ]; then
            exit 0
          fi

          canonical_tag="v${legacy_tag#postgres-v}"
          if git rev-parse "$canonical_tag" >/dev/null 2>&1; then
            exit 0
          fi

          git tag "$canonical_tag" "$legacy_tag"
          git push origin "$canonical_tag"

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_VERSION: 1.0.0
          DEFAULT_BUMP: ${{ inputs.version_part || 'patch' }}
          TAG_CONTEXT: repo
          RELEASE_BRANCHES: main
          PRERELEASE: false
          TAG_PREFIX: v

      - name: Normalize Docker image tag
        id: image_tag
        run: |
          tag="${{ steps.tag.outputs.new_tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.version }}

      - name: Build and push PostgreSQL image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: images/postgres
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
