name: Publish PostgreSQL Image

on:
  push:
    tags:
      - "postgres-v*"
  workflow_dispatch:

concurrency:
  group: publish-postgres-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/postgres-}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing PostgreSQL ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ponti-studios/hominem/postgres
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push PostgreSQL image
        uses: docker/build-push-action@v7.1.0
        with:
          context: images/postgres
          push: true
          tags: ghcr.io/ponti-studios/hominem/postgres:${{ steps.version.outputs.version }},ghcr.io/ponti-studios/hominem/postgres:latest
          labels: ${{ steps.meta.outputs.labels }}
