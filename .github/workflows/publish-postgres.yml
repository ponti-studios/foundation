name: Publish PostgreSQL Image

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: "Version part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: publish-postgres
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          INITIAL_VERSION: 1.0.0
          DEFAULT_BUMP: ${{ inputs.version_part }}
          TAG_CONTEXT: repo
          RELEASE_BRANCHES: main
          PRERELEASE: false
          PREFIX: postgres-v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ponti-studios/hominem/postgres
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push PostgreSQL image
        uses: docker/build-push-action@v7.1.0
        with:
          context: images/postgres
          push: true
          tags: ghcr.io/ponti-studios/hominem/postgres:${{ steps.tag.outputs.new_tag }},ghcr.io/ponti-studios/hominem/postgres:latest
          labels: ${{ steps.meta.outputs.labels }}
